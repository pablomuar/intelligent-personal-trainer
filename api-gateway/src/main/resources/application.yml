server:
  port: 9000

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: "http://localhost:4200"
                allowedMethods: "*"
                allowedHeaders: "*"
          routes:
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/users/**
            - id: trainer-service
              uri: lb://trainer-service
              predicates:
                - Path=/trainer/**
            - id: data-processor-service
              uri: lb://data-processor-service
              predicates:
                - Path=/data-processor/**
            - id: data-persistence-service
              uri: lb://data-persistence-service
              predicates:
                - Path=/data-persistence/**

swagger-ui:
  urls:
    - name: User Service
      url: /user-service/v3/api-docs
    - name: Data Persistence Service
      url: /data-persistence-service/v3/api-docs
    - name: Data Processor Service
      url: /data-processor-service/v3/api-docs
    - name: Trainer Service
      url: /trainer-service/v3/api-docs
  api-docs:
    enabled: true