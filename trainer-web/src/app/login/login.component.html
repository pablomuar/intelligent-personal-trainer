<div class="flex items-center justify-center min-h-screen bg-background-light dark:bg-background-dark">
  <div class="w-full max-w-md p-8 space-y-8 bg-surface-light dark:bg-surface-dark rounded-2xl shadow-soft border border-[#eff1f5] dark:border-[#2a3441]">
    <div class="text-center">
      <div class="flex justify-center items-center gap-3 mb-4">
        <span class="material-symbols-outlined text-4xl text-primary">fitness_center</span>
        <h1 class="text-3xl font-bold tracking-tight text-text-main dark:text-white">Intelligent Personal Trainer</h1>
      </div>
      <p class="text-text-secondary">Please sign in to continue</p>
    </div>
    <form [formGroup]="form" (ngSubmit)="login()" class="space-y-6">
      @if (error()) {
        <div class="p-4 mb-4 text-sm text-red-800 rounded-lg bg-red-50 dark:bg-gray-800 dark:text-red-400" role="alert">
          {{ error() }}
        </div>
      }
      <div class="relative">
        <label for="username" class="sr-only">Username</label>
        <input id="username" name="username" type="text" formControlName="username" required
          class="w-full px-5 py-3 text-lg rounded-xl border-0 bg-background-light dark:bg-background-dark text-text-main dark:text-white placeholder:text-text-secondary/70 focus:ring-2 focus:ring-primary focus:bg-white dark:focus:bg-[#1e2837] transition-all shadow-inner"
          placeholder="Username">
      </div>
      <div class="relative">
        <label for="password" class="sr-only">Password</label>
        <input id="password" name="password" type="password" formControlName="password" required
          class="w-full px-5 py-3 text-lg rounded-xl border-0 bg-background-light dark:bg-background-dark text-text-main dark:text-white placeholder:text-text-secondary/70 focus:ring-2 focus:ring-primary focus:bg-white dark:focus:bg-[#1e2837] transition-all shadow-inner"
          placeholder="Password">
      </div>
      <button type="submit" [disabled]="form.invalid"
        class="w-full flex items-center justify-center gap-2 bg-primary hover:bg-primary-dark text-white text-base font-bold h-12 px-8 rounded-xl shadow-lg shadow-primary/30 transition-all hover:scale-[1.02] active:scale-[0.98] disabled:bg-primary/50 disabled:cursor-not-allowed">
        <span>Sign In</span>
      </button>
    </form>
  </div>
</div>
