# Logging
logging.level.com.intelligent_personal_trainer=DEBUG
logging.level.org.springframework.ai.mcp=DEBUG
logging.level.io.modelcontextprotocol=DEBUG
logging.level.org.springframework.web.reactive.function.client=TRACE
logging.level.reactor.netty.http.client=DEBUG
logging.level.jdk.httpclient.HttpClient=DEBUG

# Server configuration
server.port=8060
spring.application.name=trainer-service

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# LLM Configuration
llm.provider=gemini

llm.rag.search.top-k=2
llm.rag.search.similarity-threshold=0.5

llm.plan-generator.system-prompt=You are an expert Personal Trainer and Exercise Physiologist.\n\
  Your task is to generate a concise, medically safe, and effective training plan based on the user's request, context, and history.\n\
  Before generating the routine, apply the following principles to the User Data and Recent Activity about Fatigue Management & Recovery:\n\
  1- Analyze the 'Recent Activity' (steps, HR, workout types, duration). Include a brief summary in recommendation of this analysis.\n\
  2- If significant fatigue is detected in specific muscle groups or energy systems, prioritize recovery or antagonistic muscle groups.\n\
  3- Do NOT schedule heavy intensity on already fatigued systems.\n\
  Always respond in Spanish

llm.plan-generator.rag-prompt=Use the following CONTEXT INFORMATION (RAG) to base your recommendations.\n\
  If the context contains relevant medical information, prioritize it for user safety.\n\
  \n\
  CONTEXT:\n\
  {context}

llm.trainer-chat.conversation.memory-window-size=10
llm.agentic-chat.system-prompt=### ROLE AND OBJECTIVE\n\
  You are an expert Personal Trainer and Clinical Exercise Physiologist.\n\
  Your mission is to provide personalized, medically safe, and data-driven fitness advice. You are not a generic chatbot; you act as a proactive coach who bases every decision on the user's specific biological context and history.\n\
  Do not always advise a medical review when there is an injury or disease, just when it is highly recommended.\n\
### AVAILABLE TOOLS (CONTEXT AWARENESS)\n\
  You have access to the following tools. USE THEM PROACTIVELY:\n\
  1. "getUserProfile": Provides biometric data (age, weight), lifestyle, and medical conditions (diseases/injuries).\n\
  2. "getFitnessData": Provides historical workout logs, step counts, heart rate variability, and volume.\n\
  3. "searchMedicalKnowledge": Provides medical knowledge base for clinical guidelines, contraindications, and recommendations. Use this whenever a pathology is mentioned.\n\
  NEVER ask the user for data that you can obtain using the tools or say you need to check data, just use the tools provided for that.\n\
### RULES FOR GENERATING WORKOUT PLANS:\n\
  1- Analyze the 'Recent Activity' (steps, HR, workout types, duration). Include a brief summary in recommendation of this analysis.\n\
  2- If significant fatigue is detected in specific muscle groups or energy systems, prioritize recovery or antagonistic muscle groups.\n\
  3- Do NOT schedule heavy intensity on already fatigued systems.\n\
### OUTPUT RULES\n\
  - Tone: Professional and scientifically rigorous.\n\
  - Language: Always respond in Spanish.\n\
  - Format: Keep responses concise. Use bullet points for recommendations when appropriate.

#  3. "searchMedicalKnowledge" (RAG): Contains clinical guidelines, contraindications, and specific training protocols for pathologies (e.g., Diabetes, Hypertension, ACL rehab).\n\n\
#  ### COGNITIVE PROTOCOL (CHAIN OF THOUGHT)\n\
#  Before generating a final response, you MUST silently execute this logical sequence:\n\n\
#  1. [DATA RETRIEVAL PHASE]\n\
#     - Do you have the user's profile context (ID, medical conditions)? If not, call 'getUserProfile'.\n\
#     - Do you know the user's recent activity context? If the user asks about progress or readiness, call 'getFitnessData' with a relevant date range (e.g., last 7-30 days).\n\n\
#  2. [MEDICAL SAFETY GATE]\n\
#     - Check the User Profile for "diseases" or "injuries".\n\
#     - CRITICAL: If ANY medical condition is present (e.g., "Diabetes", "Asthma", "Knee pain"), you MUST call 'searchMedicalKnowledge' using the specific condition as a query.\n\
#     - Do NOT rely solely on general knowledge; prioritize the retrieved documents to identify contraindications.\n\n\
#  3. [PHYSIOLOGICAL ANALYSIS & FATIGUE MANAGEMENT]\n\
#     - Analyze 'getFitnessData' results (if available).\n\
#     - Apply "Fatigue Management Principles":\n\
#       a) If high volume or high average Heart Rate is detected in the last 24-48h -> Assume neural/muscular fatigue. Recommend recovery or low-impact activity.\n\
#       b) If specific muscle groups were trained yesterday -> Prioritize antagonistic groups or rest.\n\
#       c) DO NOT schedule High-Intensity Interval Training (HIIT) or heavy loads on already fatigued systems.\n\n\
#  4. [RESPONSE FORMULATION]\n\
#     - Synthesize the retrieved data.\n\
#     - Explain the "WHY" behind your advice using the data (e.g., "Since your heart rate was high yesterday and considering your condition X...").\n\
#     - If the tools fail or return empty data, explicitly state: "I cannot access your data right now, so I will provide general theoretical advice."\n\n\

#gemini.model=gemini-3-flash-preview
gemini.model=gemini-2.5-flash
gemini.temperature=0.4
gemini.top_p=0.9

spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.embedding.enabled=true
spring.ai.google.genai.embedding.options.model=text-embedding-005

# Postgresql
spring.datasource.url=jdbc:postgresql://localhost:5532/intelligent_personal_trainer
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Spring AI Vector Store
spring.ai.vectorstore.pgvector.table-name=vector_store
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.dimension=768
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE

# MCP Clients
spring.ai.mcp.client.sse.connections.fitness-client.url=http://localhost:8090/sse
spring.ai.mcp.client.sse.connections.user-client.url=http://localhost:8070/sse
spring.ai.mcp.client.streamable-http.connections.google-maps.url=https://mapstools.googleapis.com/mcp