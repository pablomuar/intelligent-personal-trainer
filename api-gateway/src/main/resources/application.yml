server:
  port: 9000

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:4200"
            allowedMethods: "*"
            allowedHeaders: "*"
      routes:
        - id: user-service
          uri: http://localhost:8070
          predicates:
            - Path=/users/**
        - id: trainer-service
          uri: http://localhost:8060
          predicates:
            - Path=/trainer/**
        - id: data-processor-service
          uri: http://localhost:8080
          predicates:
            - Path=/data-processor/**
        - id: data-persistence-service
          uri: http://localhost:8090
          predicates:
            - Path=/data-persistence/**
