name: Frontend CI

on:
  push:
    branches: [ "main" ]
    paths:
      - "trainer-web/**"
  pull_request:
    paths:
      - "trainer-web/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./trainer-web

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js 24
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: trainer-web/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Run tests
      run: npm run test -- --watch=false --browsers=ChromeHeadless

    - name: Build
      run: npm run build -- --configuration production
