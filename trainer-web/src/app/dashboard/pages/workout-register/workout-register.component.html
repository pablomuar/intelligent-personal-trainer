<div class="max-w-2xl mx-auto space-y-8 animate-fade-in">
  <div class="text-center space-y-2">
    <h2 class="text-2xl font-bold text-text-main">Log a Workout</h2>
    <p class="text-text-secondary">Manually add your physical activity to track your progress.</p>
  </div>

  <div class="bg-surface-light dark:bg-surface-dark rounded-2xl shadow-soft p-6 sm:p-8 border border-gray-100 dark:border-gray-800">
    <form [formGroup]="form" (ngSubmit)="save()" class="space-y-6">

      <!-- Activity Type -->
      <div class="space-y-2">
        <label for="activityType" class="block text-sm font-medium text-text-main">Activity Type</label>
        <select
          id="activityType"
          formControlName="activityType"
          class="block w-full rounded-xl border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-900/50 text-text-main focus:border-primary focus:ring-primary sm:text-sm p-3 transition-all"
        >
          <option value="" disabled selected>Select an activity...</option>
          <option value="Running">Running</option>
          <option value="Strength training">Strength training</option>
        </select>
        <div *ngIf="form.get('activityType')?.touched && form.get('activityType')?.invalid" class="text-xs text-red-500">
          Please select an activity type.
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
        <!-- Duration -->
        <div class="space-y-2">
          <label for="duration" class="block text-sm font-medium text-text-main">Duration (minutes)</label>
          <div class="relative">
            <input
              type="number"
              id="duration"
              formControlName="duration"
              class="block w-full rounded-xl border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-900/50 text-text-main focus:border-primary focus:ring-primary sm:text-sm p-3 transition-all pl-10"
              placeholder="0"
            >
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <span class="material-symbols-outlined text-gray-400 text-lg">timer</span>
            </div>
          </div>
        </div>

        <!-- Calories -->
        <div class="space-y-2">
          <label for="calories" class="block text-sm font-medium text-text-main">Calories Burned</label>
          <div class="relative">
            <input
              type="number"
              id="calories"
              formControlName="calories"
              class="block w-full rounded-xl border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-900/50 text-text-main focus:border-primary focus:ring-primary sm:text-sm p-3 transition-all pl-10"
              placeholder="0"
            >
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <span class="material-symbols-outlined text-gray-400 text-lg">local_fire_department</span>
            </div>
          </div>
        </div>
      </div>

      <div class="flex justify-end pt-4">
        <button
          type="submit"
          [disabled]="form.invalid"
          class="inline-flex items-center gap-2 px-8 py-3 bg-primary hover:bg-primary-dark text-white text-sm font-medium rounded-xl transition-all disabled:opacity-50 disabled:cursor-not-allowed shadow-lg shadow-primary/30 hover:shadow-primary/50"
        >
          <span class="material-symbols-outlined">save</span>
          Save Workout
        </button>
      </div>

    </form>
  </div>
</div>
