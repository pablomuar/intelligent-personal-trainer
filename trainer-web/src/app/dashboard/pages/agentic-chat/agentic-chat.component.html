<div class="flex-grow w-full max-w-5xl mx-auto px-4 py-8 md:py-12 flex flex-col gap-10">
  <section class="w-full">
    <div class="bg-surface-light dark:bg-surface-dark rounded-2xl shadow-soft border border-[#eff1f5] dark:border-[#2a3441] overflow-hidden">
      <div class="p-6 md:p-10 flex flex-col gap-6">
        <div class="flex flex-col gap-2">
          <h2 class="text-2xl md:text-3xl font-bold text-text-main dark:text-white">Agentic Chat</h2>
          <p class="text-text-secondary text-base">
            Ask your expert personal trainer anything about your fitness journey.
          </p>
        </div>
        <form [formGroup]="form" (ngSubmit)="sendMessage()">
          @if (error()) {
            <div class="p-4 mb-4 text-sm text-red-800 rounded-lg bg-red-50 dark:bg-gray-800 dark:text-red-400" role="alert">
              {{ error() }}
            </div>
          }
          <div class="relative">
            <textarea formControlName="prompt"
              class="w-full min-h-[180px] p-5 rounded-xl border-0 bg-background-light dark:bg-background-dark text-text-main dark:text-white placeholder:text-text-secondary/70 focus:ring-2 focus:ring-primary focus:bg-white dark:focus:bg-[#1e2837] transition-all resize-none text-lg leading-relaxed shadow-inner"
              placeholder="E.g., How can I improve my deadlift form?"></textarea>
            <div class="absolute bottom-4 right-4 text-xs text-text-secondary bg-surface-light/80 dark:bg-surface-dark/80 px-2 py-1 rounded backdrop-blur-sm">
              AI-Powered
            </div>
          </div>
          <div class="flex justify-end items-center pt-4">
            <button type="submit" [disabled]="form.invalid || loading()"
              class="ml-auto flex items-center justify-center gap-2 bg-primary hover:bg-primary-dark text-white text-base font-bold h-12 px-8 rounded-xl shadow-lg shadow-primary/30 transition-all hover:scale-[1.02] active:scale-[0.98] disabled:bg-primary/50 disabled:cursor-not-allowed">
              <span class="material-symbols-outlined">send</span>
              <span>{{ loading() ? 'Thinking...' : 'Send' }}</span>
            </button>
          </div>
        </form>
      </div>
    </div>
  </section>

  @if (response()) {
    <section class="w-full flex flex-col gap-6 animate-fade-in pb-12">
      <div class="flex items-center justify-between px-2">
        <h3 class="text-xl font-bold text-text-main dark:text-white flex items-center gap-2">
          <span class="material-symbols-outlined text-primary">smart_toy</span>
          Trainer Response
        </h3>
      </div>

      <div class="bg-surface-light dark:bg-surface-dark rounded-2xl shadow-soft border border-primary/20 overflow-hidden relative">
        <div class="absolute top-0 left-0 w-1 h-full bg-primary"></div>
        <div class="p-6 md:p-8">
          <div class="prose dark:prose-invert max-w-none">
            <markdown [data]="response()"></markdown>
          </div>
        </div>
      </div>
    </section>
  }
</div>
