<div class="max-w-4xl mx-auto space-y-8 animate-fade-in pb-12">
  <div class="text-center space-y-2">
    <h2 class="text-2xl font-bold text-text-main">Log a Workout</h2>
    <p class="text-text-secondary">Manually add your physical activity to track your progress.</p>
  </div>

  <div class="bg-surface-light dark:bg-surface-dark rounded-2xl shadow-soft p-6 sm:p-8 border border-gray-100 dark:border-gray-800">
    <form [formGroup]="form" (ngSubmit)="save()" class="space-y-6">

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
        <!-- Timestamp -->
        <div class="space-y-2">
          <label for="timestamp" class="block text-sm font-medium text-text-main">Date</label>
          <div class="relative">
            <input
              type="date"
              id="timestamp"
              formControlName="timestamp"
              class="block w-full rounded-xl border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-900/50 text-text-main focus:border-primary focus:ring-primary sm:text-sm p-3 transition-all pl-10"
            >
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <span class="material-symbols-outlined text-gray-400 text-lg">calendar_today</span>
            </div>
          </div>
        </div>

        <!-- Average Heart Rate -->
        <div class="space-y-2">
          <label for="averageHeartRate" class="block text-sm font-medium text-text-main">Avg Heart Rate (bpm)</label>
          <div class="relative">
            <input
              type="number"
              id="averageHeartRate"
              formControlName="averageHeartRate"
              class="block w-full rounded-xl border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-900/50 text-text-main focus:border-primary focus:ring-primary sm:text-sm p-3 transition-all pl-10"
              placeholder="0"
            >
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <span class="material-symbols-outlined text-gray-400 text-lg">favorite</span>
            </div>
          </div>
        </div>

        <!-- Total Steps -->
        <div class="space-y-2">
          <label for="totalSteps" class="block text-sm font-medium text-text-main">Total Steps</label>
          <div class="relative">
            <input
              type="number"
              id="totalSteps"
              formControlName="totalSteps"
              class="block w-full rounded-xl border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-900/50 text-text-main focus:border-primary focus:ring-primary sm:text-sm p-3 transition-all pl-10"
              placeholder="0"
            >
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <span class="material-symbols-outlined text-gray-400 text-lg">directions_walk</span>
            </div>
          </div>
        </div>

        <!-- Total Distance -->
        <div class="space-y-2">
          <label for="totalDistance" class="block text-sm font-medium text-text-main">Total Distance (km)</label>
          <div class="relative">
            <input
              type="number"
              id="totalDistance"
              formControlName="totalDistance"
              class="block w-full rounded-xl border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-900/50 text-text-main focus:border-primary focus:ring-primary sm:text-sm p-3 transition-all pl-10"
              placeholder="0"
            >
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <span class="material-symbols-outlined text-gray-400 text-lg">straighten</span>
            </div>
          </div>
        </div>

        <!-- Total Calories -->
        <div class="space-y-2 sm:col-span-2">
          <label for="totalCaloriesBurned" class="block text-sm font-medium text-text-main">Total Calories Burned</label>
          <div class="relative">
            <input
              type="number"
              id="totalCaloriesBurned"
              formControlName="totalCaloriesBurned"
              class="block w-full rounded-xl border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-900/50 text-text-main focus:border-primary focus:ring-primary sm:text-sm p-3 transition-all pl-10"
              placeholder="0"
            >
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <span class="material-symbols-outlined text-gray-400 text-lg">local_fire_department</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Divider -->
      <div class="border-t border-gray-200 dark:border-gray-700 my-6"></div>

      <!-- Add Workout Section -->
      <div class="space-y-4">
        <h3 class="text-lg font-semibold text-text-main">Add Workouts</h3>

        <div class="bg-gray-50 dark:bg-gray-900/30 rounded-xl p-4 border border-gray-200 dark:border-gray-700 space-y-4">

          <!-- Workout Type Form -->
          <form [formGroup]="workoutForm" class="space-y-2">
            <label for="workoutType" class="block text-sm font-medium text-text-main">Workout Type</label>
            <select
              id="workoutType"
              formControlName="workoutType"
              class="block w-full rounded-xl border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-text-main focus:border-primary focus:ring-primary sm:text-sm p-3 transition-all"
            >
              <option value="" disabled selected>Select type...</option>
              <option value="Running">Running</option>
              <option value="Cycling">Cycling</option>
              <option value="Swimming">Swimming</option>
              <option value="Weightlifting">Weightlifting</option>
              <option value="Yoga">Yoga</option>
              <option value="HIIT">HIIT</option>
              <option value="Other">Other</option>
            </select>
          </form>

          <!-- Attributes Form -->
           <div class="space-y-2">
            <label class="block text-sm font-medium text-text-main">Attributes</label>
            <form [formGroup]="attributeForm" (ngSubmit)="addAttribute()" class="flex gap-2">
              <input
                type="text"
                formControlName="key"
                placeholder="Key (e.g. Duration)"
                class="block w-1/2 rounded-xl border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-text-main focus:border-primary focus:ring-primary sm:text-sm p-2 transition-all"
              >
              <input
                type="text"
                formControlName="value"
                placeholder="Value (e.g. 30 mins)"
                class="block w-1/2 rounded-xl border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-text-main focus:border-primary focus:ring-primary sm:text-sm p-2 transition-all"
              >
              <button
                type="submit"
                [disabled]="attributeForm.invalid"
                class="inline-flex items-center justify-center p-2 bg-primary hover:bg-primary-dark text-white rounded-xl transition-all disabled:opacity-50"
              >
                <span class="material-symbols-outlined">add</span>
              </button>
            </form>
          </div>

          <!-- Current Attributes Table -->
          <div *ngIf="(currentAttributes() | keyvalue).length > 0" class="overflow-hidden rounded-lg border border-gray-200 dark:border-gray-700">
            <table class="min-w-full divide-y divide-gray-200 dark:divide-gray-700">
              <thead class="bg-gray-100 dark:bg-gray-800">
                <tr>
                  <th scope="col" class="px-4 py-2 text-left text-xs font-medium text-text-secondary uppercase tracking-wider">Key</th>
                  <th scope="col" class="px-4 py-2 text-left text-xs font-medium text-text-secondary uppercase tracking-wider">Value</th>
                  <th scope="col" class="px-4 py-2 text-right text-xs font-medium text-text-secondary uppercase tracking-wider">Action</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-gray-200 dark:divide-gray-700 bg-white dark:bg-gray-900">
                <tr *ngFor="let attr of currentAttributes() | keyvalue">
                  <td class="px-4 py-2 whitespace-nowrap text-sm text-text-main">{{ attr.key }}</td>
                  <td class="px-4 py-2 whitespace-nowrap text-sm text-text-main">{{ attr.value }}</td>
                  <td class="px-4 py-2 whitespace-nowrap text-right text-sm font-medium">
                    <button type="button" (click)="removeAttribute(attr.key)" class="text-red-500 hover:text-red-700">
                      <span class="material-symbols-outlined text-lg">delete</span>
                    </button>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>

          <div class="flex justify-end">
            <button
              type="button"
              (click)="addWorkout()"
              [disabled]="workoutForm.invalid"
              class="inline-flex items-center gap-2 px-4 py-2 bg-primary hover:bg-primary-dark text-white text-sm font-medium rounded-xl transition-all disabled:opacity-50 disabled:cursor-not-allowed"
            >
              <span class="material-symbols-outlined">playlist_add</span>
              Add Workout to List
            </button>
          </div>
        </div>

        <!-- Added Workouts List -->
        <div *ngIf="workoutList().length > 0" class="space-y-2">
           <h4 class="text-sm font-semibold text-text-main">Workouts to be Saved:</h4>
           <div class="space-y-2">
             <div *ngFor="let workout of workoutList(); let i = index" class="bg-white dark:bg-gray-800 p-3 rounded-xl border border-gray-200 dark:border-gray-700 flex justify-between items-start shadow-sm">
                <div>
                  <div class="font-medium text-text-main">{{ workout.workoutType }}</div>
                  <div class="text-xs text-text-secondary mt-1">
                    <span *ngFor="let attr of workout.attributes | keyvalue; let last = last">
                      {{ attr.key }}: {{ attr.value }}<span *ngIf="!last">, </span>
                    </span>
                  </div>
                </div>
                <button type="button" (click)="removeWorkout(i)" class="text-red-500 hover:text-red-700 p-1">
                   <span class="material-symbols-outlined">close</span>
                </button>
             </div>
           </div>
        </div>

      </div>

      <div class="flex justify-end pt-4 border-t border-gray-200 dark:border-gray-700">
        <button
          type="submit"
          [disabled]="form.invalid"
          class="inline-flex items-center gap-2 px-8 py-3 bg-primary hover:bg-primary-dark text-white text-sm font-medium rounded-xl transition-all disabled:opacity-50 disabled:cursor-not-allowed shadow-lg shadow-primary/30 hover:shadow-primary/50"
        >
          <span class="material-symbols-outlined">save</span>
          Save Daily Fitness Data
        </button>
      </div>

    </form>
  </div>
</div>
