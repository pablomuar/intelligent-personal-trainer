<div class="min-h-screen">
  <!-- Header -->
  <header class="bg-surface-light/80 dark:bg-surface-dark/80 backdrop-blur-md sticky top-0 z-50 border-b border-gray-200/50 dark:border-gray-800/50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-primary/10 flex items-center justify-center">
            <span class="material-symbols-outlined text-primary">fitness_center</span>
          </div>
          <div>
            <h1 class="text-xl font-bold bg-gradient-to-r from-primary to-primary-dark bg-clip-text text-transparent">
              Intelligent Personal Trainer
            </h1>
          </div>
        </div>

        <div class="flex items-center gap-4">
          <div class="hidden sm:flex items-center gap-2 px-3 py-1.5 rounded-full bg-gray-100 dark:bg-gray-800">
            <div class="w-8 h-8 rounded-full bg-primary/10 flex items-center justify-center">
              <span class="material-symbols-outlined text-primary text-sm">person</span>
            </div>
            <span class="text-sm font-medium text-text-main">
              {{ user()?.username }}
            </span>
          </div>

          <button (click)="logout()"
                  class="p-2 rounded-lg hover:bg-red-50 dark:hover:bg-red-900/10 text-gray-500 hover:text-red-600 transition-colors"
                  title="Sign out">
            <span class="material-symbols-outlined">logout</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Navigation Tabs -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <nav class="flex space-x-8" aria-label="Tabs">
        <a routerLink="chat"
           routerLinkActive="border-primary text-primary"
           class="whitespace-nowrap py-4 px-1 border-b-2 border-transparent font-medium text-sm text-text-secondary hover:text-text-main hover:border-gray-300 transition-colors">
           Agentic Chat
        </a>

        <a routerLink="history"
           routerLinkActive="border-primary text-primary"
           class="whitespace-nowrap py-4 px-1 border-b-2 border-transparent font-medium text-sm text-text-secondary hover:text-text-main hover:border-gray-300 transition-colors">
           History
        </a>

        <a routerLink="register"
           routerLinkActive="border-primary text-primary"
           class="whitespace-nowrap py-4 px-1 border-b-2 border-transparent font-medium text-sm text-text-secondary hover:text-text-main hover:border-gray-300 transition-colors">
           Log Workout
        </a>
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <router-outlet></router-outlet>
  </main>
</div>
